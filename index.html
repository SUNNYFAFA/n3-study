<style>
  :root {
    --bg: #F2EDE1;
    --surface: #FFFFFF;
    --surface-sunken: #E9E1CE;
    --border: #D9CFB6;
    --ink: #2A2621;
    --ink-soft: #6B6255;
    --indigo: #2C4A6E;
    --indigo-soft: #E4EBF1;
    --hanko: #AF3B33;
    --hanko-soft: #F5E4E1;
    --moss: #52704F;
    --moss-soft: #E6EDE1;
    --shadow: 0 1px 2px rgba(42,38,33,0.06), 0 6px 20px rgba(42,38,33,0.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1914;
      --surface: #262119;
      --surface-sunken: #302A1F;
      --border: #443C2C;
      --ink: #EDE6D6;
      --ink-soft: #B3A890;
      --indigo: #8FB4D9;
      --indigo-soft: #2A3947;
      --hanko: #E28B7D;
      --hanko-soft: #402823;
      --moss: #9BBB92;
      --moss-soft: #29331F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1914;
    --surface: #262119;
    --surface-sunken: #302A1F;
    --border: #443C2C;
    --ink: #EDE6D6;
    --ink-soft: #B3A890;
    --indigo: #8FB4D9;
    --indigo-soft: #2A3947;
    --hanko: #E28B7D;
    --hanko-soft: #402823;
    --moss: #9BBB92;
    --moss-soft: #29331F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .jp { font-family: "Noto Sans JP", "Noto Sans KR", sans-serif; }
  .display { font-family: "Shippori Mincho", "Noto Sans JP", serif; }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .tabbar-mobile { display: flex; }
  }

  .rail {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 10px 22px;
  }
  .brand .seal {
    width: 30px; height: 30px;
    border-radius: 7px;
    background: var(--hanko);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Shippori Mincho", serif;
    font-size: 16px;
    font-weight: 700;
    flex: none;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text b { font-family: "Shippori Mincho", serif; font-size: 17px; letter-spacing: 0.02em; }
  .brand-text span { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.04em; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14.5px;
    font-weight: 500;
    user-select: none;
  }
  .nav-item .ico { font-size: 16px; width: 18px; text-align: center; }
  .nav-item:hover { background: var(--surface-sunken); color: var(--ink); }
  .nav-item.active { background: var(--indigo-soft); color: var(--indigo); font-weight: 700; }

  .rail-foot {
    margin-top: auto;
    padding: 12px;
    border-radius: 12px;
    background: var(--surface-sunken);
    display: flex; flex-direction: column; gap: 6px;
  }
  .streak-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .streak-row b { color: var(--hanko); font-size: 16px; font-family: "Shippori Mincho", serif; }

  .tabbar-mobile {
    display: none;
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 8px;
    gap: 4px;
    overflow-x: auto;
  }
  .tabbar-mobile .nav-item { flex: none; padding: 8px 12px; font-size: 13px; }

  main {
    padding: 32px clamp(16px, 4vw, 48px) 64px;
    max-width: 980px;
    width: 100%;
  }
  .page-head { margin-bottom: 22px; }
  .page-head h1 {
    font-family: "Shippori Mincho", serif;
    font-size: 26px;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .page-head p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .placeholder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* ---- Kana chart ---- */
  .kana-quiz-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .kana-toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .seg {
    display: inline-flex; background: var(--surface-sunken);
    border-radius: 10px; padding: 3px; gap: 2px;
  }
  .seg button {
    border: none; background: transparent; color: var(--ink-soft);
    padding: 7px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .seg button.active { background: var(--surface); color: var(--indigo); box-shadow: var(--shadow); }
  .toggle-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); font-size: 13px; color: var(--ink-soft);
    cursor: pointer; user-select: none; margin-left: auto;
  }
  .toggle-chip input { accent-color: var(--indigo); }

  .kana-block { margin-bottom: 26px; }
  .kana-block h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-soft); font-weight: 700; margin: 0 0 10px;
  }
  .kana-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .kana-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 560px) {
    .kana-grid { grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
  }
  .kana-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 4px 8px;
    text-align: center;
    cursor: pointer;
    transition: background .12s;
  }
  .kana-cell:hover { background: var(--surface-sunken); }
  .kana-cell .ch {
    font-family: "Shippori Mincho", serif;
    font-size: 26px; line-height: 1.1;
    display: block;
  }
  .kana-cell .rj {
    display: block;
    font-size: 11.5px; color: var(--ink-soft);
    margin-top: 3px; letter-spacing: 0.02em;
    min-height: 14px;
  }
  .kana-cell.hidden-rj .rj { opacity: 0; }
  .kana-cell.hidden-rj.revealed .rj { opacity: 1; color: var(--hanko); }
  .kana-cell.empty { visibility: hidden; }

  /* ---- Deck browse (kanji/vocab/grammar) ---- */
  .deck-toolbar {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .search-box {
    flex: 1; min-width: 180px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px;
  }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--ink); width: 100%;
    font-family: inherit;
  }
  .search-box .ico { color: var(--ink-soft); font-size: 14px; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .chip.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .deck-count { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; }

  .kanji-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 10px;
  }
  .kanji-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 8px 10px;
    text-align: center; cursor: pointer;
    min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
  }
  .kanji-card .ch { font-family: "Shippori Mincho", serif; font-size: 32px; line-height: 1; }
  .kanji-card .rd { font-size: 11px; color: var(--ink-soft); }
  .kanji-card .mean { font-size: 12px; font-weight: 700; color: var(--indigo); display: none; padding: 0 2px; }
  .kanji-card.flipped .rd.on-kun { display: block; }
  .kanji-card .rd.on-kun { display: none; }
  .kanji-card.flipped .mean { display: block; }
  .kanji-card.flipped .ch { font-size: 24px; color: var(--ink-soft); }
  .kanji-card .cat-tag { display:none; }

  /* ---- Vocab list ---- */
  .vocab-list { display: flex; flex-direction: column; gap: 8px; }
  .vocab-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
  }
  .vocab-row .word { font-family: "Noto Sans JP", sans-serif; font-size: 17px; font-weight: 600; min-width: 110px; }
  .vocab-row .reading { font-size: 13px; color: var(--ink-soft); min-width: 100px; }
  .vocab-row .pos-tag {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--indigo-soft); color: var(--indigo); white-space: nowrap;
  }
  .vocab-row .mean { font-size: 13.5px; color: var(--ink); flex: 1; display: none; }
  .vocab-row.flipped .mean { display: block; }
  .vocab-row.flipped { background: var(--surface-sunken); }
  @media (max-width: 560px) {
    .vocab-row { flex-wrap: wrap; }
    .vocab-row .word, .vocab-row .reading { min-width: 0; }
  }

  /* ---- Grammar list ---- */
  .grammar-list { display: flex; flex-direction: column; gap: 10px; }
  .grammar-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; cursor: pointer;
  }
  .grammar-card-head { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; }
  .grammar-pattern { font-family: "Shippori Mincho", serif; font-size: 19px; font-weight: 600; }
  .grammar-mean { font-size: 13.5px; color: var(--ink-soft); text-align: right; }
  .grammar-example {
    display: none; margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .grammar-card.open .grammar-example { display: block; }
  .grammar-ex-jp { font-family: "Noto Sans JP", sans-serif; font-size: 15px; margin-bottom: 4px; }
  .grammar-ex-reading { font-size: 12.5px; color: var(--hanko); margin-bottom: 4px; }
  .grammar-ex-kr { font-size: 13px; color: var(--ink-soft); }
  .grammar-cat-tag {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--moss);
    background: var(--moss-soft); border-radius: 999px; padding: 2px 9px; margin-bottom: 8px;
  }

  /* ---- Home dashboard ---- */
  .home-hero {
    background: linear-gradient(135deg, var(--indigo-soft), var(--surface));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 28px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .home-hero-text b { font-family: "Shippori Mincho", serif; font-size: 20px; display: block; margin-bottom: 4px; }
  .home-hero-text span { font-size: 13.5px; color: var(--ink-soft); }
  .primary-btn {
    background: var(--indigo); color: #fff; border: none; border-radius: 12px;
    padding: 14px 26px; font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; box-shadow: var(--shadow);
  }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }
  .primary-btn.ghost { background: transparent; border: 1px solid var(--indigo); color: var(--indigo); }

  .deck-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 14px; margin-bottom: 22px; }
  .deck-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .deck-card .dh { display: flex; align-items: center; gap: 8px; }
  .deck-card .dh .ico { font-family: "Shippori Mincho", serif; font-size: 20px; color: var(--hanko); }
  .deck-card .dh b { font-size: 15.5px; }
  .deck-card .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .pill.due { background: var(--hanko-soft); color: var(--hanko); }
  .pill.new { background: var(--indigo-soft); color: var(--indigo); }
  .pill.mastered { background: var(--moss-soft); color: var(--moss); }
  .deck-card .mini-btn {
    background: var(--surface-sunken); border: 1px solid var(--border);
    color: var(--ink); border-radius: 9px; padding: 8px 10px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .deck-card-btn-row { display: flex; gap: 8px; margin-top: auto; }
  .deck-card-btn-row .mini-btn { flex: 1; }
  .mini-btn.ghost { background: transparent; border: 1px solid var(--indigo); color: var(--indigo); }

  /* ---- Home: quiz / wrong-review action cards ---- */
  .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px; margin-bottom: 22px; }
  .action-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 8px;
  }
  .action-card .ah { font-size: 15.5px; font-weight: 700; }
  .action-card p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .action-card .mini-btn { margin-top: auto; }
  .action-card .mini-btn:disabled { opacity: 0.5; cursor: default; }
  .done-tag {
    display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--moss);
    background: var(--moss-soft); border-radius: 999px; padding: 3px 10px; width: fit-content;
  }

  /* ---- Home: 7-day cycle ---- */
  .cycle-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 22px;
  }
  .cycle-head { display: flex; flex-direction: column; gap: 3px; margin-bottom: 14px; }
  .cycle-head b { font-size: 15.5px; }
  .cycle-head span { font-size: 12.5px; color: var(--ink-soft); }
  .cycle-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  @media (max-width: 640px) { .cycle-days { grid-template-columns: repeat(4, 1fr); } }
  .cycle-day-btn {
    border: 1px solid var(--border); background: var(--surface-sunken); border-radius: 10px;
    padding: 10px 4px; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--ink);
  }
  .cycle-day-btn .dnum { font-size: 12px; font-weight: 700; }
  .cycle-day-btn .dcount { font-size: 11px; color: var(--ink-soft); }
  .cycle-day-btn .dcheck { font-size: 10px; font-weight: 700; color: var(--moss); }
  .cycle-day-btn.done { background: var(--moss-soft); border-color: var(--moss); }

  .settings-row {
    display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft);

// ==================== UNIFIED CARDS + SRS ====================
const DECK_LABELS = { kana:'가나', kanji:'한자', vocab:'단어', grammar:'문법' };
const DECK_ICO = { kana:'あ', kanji:'漢', vocab:'語', grammar:'文' };

function buildAllCards() {
  const cards = [];
  Object.keys(HIRAGANA_MAP).forEach((r, i) => {
    cards.push({ id: 'kana_h_'+r, deck: 'kana', script: 'hira', front: HIRAGANA_MAP[r], back: romajiLabel(r) + ' · 히라가나', short: romajiLabel(r), dayBucket: (i % 7) + 1 });
  });
  Object.keys(KATAKANA_MAP).forEach((r, i) => {
    cards.push({ id: 'kana_k_'+r, deck: 'kana', script: 'kata', front: KATAKANA_MAP[r], back: romajiLabel(r) + ' · 가타카나', short: romajiLabel(r), dayBucket: (i % 7) + 1 });
  });
  KANJI.forEach((k, i) => cards.push({
    id: k.id, deck: 'kanji', front: k.ch,
    back: `${k.on}${k.kun ? ' , ' + k.kun : ''}<br>${k.mean}`, ref: k, short: k.mean, dayBucket: (i % 7) + 1,
  }));
  VOCAB.forEach((v, i) => cards.push({
    id: v.id, deck: 'vocab', front: v.word,
    back: `${v.reading}<br>${v.mean}`, ref: v, short: v.mean, dayBucket: (i % 7) + 1,
  }));
  GRAMMAR.forEach((g, i) => cards.push({
    id: g.id, deck: 'grammar', front: g.pattern, back: g.mean, ref: g, hasExample: true, short: g.mean, dayBucket: (i % 7) + 1,
  }));
  return cards;
}
const ALL_CARDS = buildAllCards();
const CARDS_BY_ID = Object.fromEntries(ALL_CARDS.map(c => [c.id, c]));

const DAY_MS = 86400000;
function todayIdx() { return Math.floor(Date.now() / DAY_MS); }
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120]; // days per box level
function nextBox(box, grade) {
  if (grade === 'again') return 0;
  if (grade === 'hard') return Math.max(1, box);
  if (grade === 'good') return Math.min(INTERVALS.length - 1, box + 1);
  if (grade === 'easy') return Math.min(INTERVALS.length - 1, box + 2);
  return box;
}
function dueAfterGrade(box, grade) {
  const t = todayIdx();
  return grade === 'again' ? t : t + INTERVALS[box];
}

// ---- profiles (SH / DN) : 로그인 없이, 기기 하나에서 두 사람이 완전히 분리된 진도 사용 ----
const PROFILES = [
  { id: 'SH', label: 'SH' },
  { id: 'DN', label: 'DN' },
];
let activeProfile = localStorage.getItem('n3_active_profile') || null;

function profileStorageKey() { return 'n3srs_v1_' + (activeProfile || 'default'); }
function profileDbPath() { return 'progress_' + (activeProfile || 'default'); }

// ---- storage: db capability (Claude 로그인 시) with localStorage fallback (로그인 불필요) ----
let dbApi = null;
let progressMap = new Map();
let metaData = { streak: 0, lastStudyDay: null, totalReviews: 0, newCardLimit: 20, cycleCount: 0, cycleDoneDays: [], lastQuizDate: null, lastQuizScore: null };
let storageReady = false;

function localBlob() {
  try { return JSON.parse(localStorage.getItem(profileStorageKey()) || '{}'); } catch (e) { return {}; }
}
function saveLocalBlob(obj) {
  try { localStorage.setItem(profileStorageKey(), JSON.stringify(obj)); } catch (e) {}
}

async function initStorage() {
  try { dbApi = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }
  catch (e) { dbApi = null; }

  if (dbApi) {
    try {
      const snap = await dbApi.collection(profileDbPath()).get();
      snap.docs.forEach(d => {
        if (d.id === '_meta') metaData = Object.assign(metaData, d.data());
        else progressMap.set(d.id, d.data());
      });
    } catch (e) { dbApi = null; }
  }
  if (!dbApi) {
    const blob = localBlob();
    Object.entries(blob.cards || {}).forEach(([id, val]) => progressMap.set(id, val));
    if (blob.meta) metaData = Object.assign(metaData, blob.meta);
  }
  storageReady = true;
}

async function saveCardProgress(id, data) {
  progressMap.set(id, data);
  if (dbApi) {
    try { await dbApi.doc(profileDbPath() + '/' + id).set(data); return; } catch (e) {}
  }
  const blob = localBlob();
  blob.cards = blob.cards || {};
  blob.cards[id] = data;
  saveLocalBlob(blob);
}
async function saveMeta() {
  if (dbApi) {
    try { await dbApi.doc(profileDbPath() + '/_meta').set(metaData); return; } catch (e) {}
  }
  const blob = localBlob();
  blob.meta = metaData;
  saveLocalBlob(blob);
}

// ---- 백업 코드로 기기 간 이동 (로그인 없이) ----
function exportProfileCode() {
  const blob = localBlob();
  const payload = { p: activeProfile, cards: blob.cards || {}, meta: blob.meta || metaData };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function importProfileCode(code) {
  const payload = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  saveLocalBlob({ cards: payload.cards || {}, meta: payload.meta || {} });
}

async function gradeCard(id, grade) {
  const cur = progressMap.get(id) || { box: 0, due: todayIdx(), reps: 0, missCount: 0, correctStreak: 0 };
  const box = nextBox(cur.box ?? 0, grade);
  const due = dueAfterGrade(box, grade);
  const isCorrect = grade !== 'again';
  const missCount = (cur.missCount || 0) + (isCorrect ? 0 : 1);
  const correctStreak = isCorrect ? (cur.correctStreak || 0) + 1 : 0;
  const data = { box, due, reps: (cur.reps || 0) + 1, lastGrade: grade, missCount, correctStreak, updatedAt: Date.now() };
  await saveCardProgress(id, data);
  metaData.totalReviews = (metaData.totalReviews || 0) + 1;
  const t = todayIdx();
  if (metaData.lastStudyDay !== t) {
    metaData.streak = (metaData.lastStudyDay === t - 1) ? (metaData.streak || 0) + 1 : 1;
    metaData.lastStudyDay = t;
  }
  saveMeta();
  return data;
}

function isInWrongQueue(card) {
  const p = progressMap.get(card.id);
  return !!p && (p.missCount || 0) > 0 && (p.correctStreak || 0) < 2;
}
function wrongQueueCards(deckFilter) {
  return ALL_CARDS.filter(c => (!deckFilter || c.deck === deckFilter) && isInWrongQueue(c));
}
function cardStatus(card) {
  const p = progressMap.get(card.id);
  if (!p) return 'new';
  if (p.box >= 6) return 'mastered';
  if (p.due <= todayIdx()) return 'due';
  return 'learning';
}
function deckStats(deck) {
  const cards = ALL_CARDS.filter(c => c.deck === deck);
  const s = { new: 0, due: 0, learning: 0, mastered: 0, total: cards.length };
  cards.forEach(c => { s[cardStatus(c)]++; });
  return s;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSession(deckFilter) {
  const decks = deckFilter ? [deckFilter] : ['kana', 'kanji', 'vocab', 'grammar'];
  let wrong = [], due = [], fresh = [];
  decks.forEach(d => {
    ALL_CARDS.filter(c => c.deck === d).forEach(c => {
      if (isInWrongQueue(c)) { wrong.push(c); return; }
      const st = cardStatus(c);
      if (st === 'due') due.push(c);
      else if (st === 'new') fresh.push(c);
    });
  });
  due.sort((a, b) => (progressMap.get(a.id)?.due || 0) - (progressMap.get(b.id)?.due || 0));
  const limit = metaData.newCardLimit || 20;
  const freshPicked = shuffle(fresh).slice(0, limit);
  return [...shuffle(wrong), ...due, ...freshPicked];
}
function buildWrongSession(deckFilter) {
  return shuffle(wrongQueueCards(deckFilter));
}

function cycleDayCards(day) {

function isCycleDayDone(day) {
  return (metaData.cycleDoneDays || []).includes(day);
}
function buildCycleSession() {
  if (pendingCycleDay == null) return [];
  return shuffle(cycleDayCards(pendingCycleDay));
}
async function markCycleDayDone(day) {
  const doneDays = new Set(metaData.cycleDoneDays || []);
  doneDays.add(day);
  if (doneDays.size >= 7) {
    metaData.cycleCount = (metaData.cycleCount || 0) + 1;
    metaData.cycleDoneDays = [];
  } else {
    metaData.cycleDoneDays = [...doneDays];
  }
  await saveMeta();
}

// ==================== TEXT-TO-SPEECH (무료, 브라우저 내장 Web Speech API) ====================
let jaVoice = null;
let ttsSupport = null; // null=아직모름, true=일본어 음성 있음, false=없음
function pickJaVoice() {
  if (!('speechSynthesis' in window)) { ttsSupport = false; return; }
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return; // 아직 로드 전
  jaVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja')) || null;
  ttsSupport = !!jaVoice;
  updateVoiceWarning();
}
if ('speechSynthesis' in window) {
  pickJaVoice();
  window.speechSynthesis.onvoiceschanged = pickJaVoice;
  setTimeout(pickJaVoice, 500); // 일부 브라우저는 voiceschanged가 늦거나 안 옴
} else {
  ttsSupport = false;
}
function updateVoiceWarning() {
  const el = document.getElementById('voiceWarning');
  if (!el) return;
  el.style.display = (ttsSupport === false) ? 'block' : 'none';
}
function speakJa(text, btn) {
  if (!text) return;
  if (!('speechSynthesis' in window)) {
    alert('이 브라우저는 음성 읽기를 지원하지 않아요.');
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if (jaVoice) u.voice = jaVoice;
    u.rate = 0.85;
    if (btn) { btn.classList.add('speaking'); u.onend = () => btn.classList.remove('speaking'); u.onerror = () => btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function speakBtnHtml(text, extraClass) {
  return `<button class="speak-btn ${extraClass||''}" data-speak="${text.replace(/"/g,'&quot;')}" title="발음 듣기" onclick="event.stopPropagation(); speakJa(this.dataset.speak, this);">🔊</button>`;
}

        <button class="mini-btn" id="exportBtn">내보내기 코드 만들기</button>
        <button class="mini-btn" id="importBtn">코드로 가져오기</button>
      </div>
      <textarea class="sync-textarea" id="syncTextarea" placeholder="여기에 코드를 붙여넣고 아래 '적용' 버튼을 누르세요"></textarea>
      <div class="sync-actions" id="importApplyWrap" style="display:none; margin-top:8px;">
        <button class="mini-btn" id="applyImportBtn">적용하기</button>
      </div>
    </div>
    <div class="settings-row">
      <span>하루 신규 카드 수</span>
      <input type="number" id="newLimitInput" min="0" max="100" value="${metaData.newCardLimit || 20}" />
      <span class="storage-note">${dbApi ? '<b>Claude 계정으로 자동 동기화</b> 중' : '이 기기에 저장 중 (로그인 불필요)'}</span>
    </div>
    <div class="deck-cards">
      ${decks.map(deckSummaryCardHtml).join('')}
    </div>
  `;
  updateVoiceWarning();

  main.querySelector('#exportBtn').addEventListener('click', () => {
    const code = exportProfileCode();
    const ta = main.querySelector('#syncTextarea');
    ta.style.display = 'block';
    ta.value = code;
    ta.select();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code)
        .then(() => { main.querySelector('#exportBtn').textContent = '복사됨! (클립보드)'; })
        .catch(() => {});
    }
  });
  main.querySelector('#importBtn').addEventListener('click', () => {
    const ta = main.querySelector('#syncTextarea');
    ta.style.display = 'block';
    ta.value = '';
    ta.placeholder = '여기에 다른 기기에서 받은 코드를 붙여넣으세요';
    ta.focus();
    main.querySelector('#importApplyWrap').style.display = 'flex';
  });
  main.querySelector('#applyImportBtn')?.addEventListener('click', async () => {
    const code = main.querySelector('#syncTextarea').value;
    if (!code.trim()) return;
    if (!confirm('현재 프로필(' + activeProfile + ')의 진도를 이 코드로 덮어씁니다. 계속할까요?')) return;
    try {
      importProfileCode(code);
      progressMap = new Map();
      metaData = { streak: 0, lastStudyDay: null, totalReviews: 0, newCardLimit: 20, cycleCount: 0, cycleDoneDays: [], lastQuizDate: null, lastQuizScore: null };
      storageReady = false;
      await initStorage();
      renderNav();
      renderPage();
    } catch (e) {
      alert('코드를 읽을 수 없어요. 정확히 복사했는지 확인해주세요.');
    }
  });

  main.querySelector('#startAllBtn').addEventListener('click', () => startSession(null, 'srs'));
  main.querySelector('#startQuizBtn')?.addEventListener('click', () => startQuiz(main));
  main.querySelector('#startWrongBtn')?.addEventListener('click', () => startSession(null, 'wrong'));
  main.querySelectorAll('.deck-cards [data-deck]').forEach(btn => {
    btn.addEventListener('click', () => startSession(btn.dataset.deck, 'srs'));
  });
  main.querySelectorAll('.deck-cards [data-quiz-deck]').forEach(btn => {
    btn.addEventListener('click', () => startQuiz(main, { deck: btn.dataset.quizDeck }));
  });
  main.querySelectorAll('.cycle-day-btn').forEach(btn => {
    btn.addEventListener('click', () => startSession(null, 'cycle', parseInt(btn.dataset.day, 10)));
  });
  main.querySelector('#newLimitInput').addEventListener('change', (e) => {
    const v = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0));
    metaData.newCardLimit = v;
    saveMeta();
    renderHomePage(main);
  });
}

// ==================== STUDY SESSION ====================
function startSession(deckFilter, mode, day) {
  mode = mode || 'srs';
  let queue;
  if (mode === 'wrong') queue = buildWrongSession(deckFilter);
  else if (mode === 'cycle') { pendingCycleDay = day; queue = buildCycleSession(); }
  else queue = buildSession(deckFilter);
  if (queue.length === 0) return;
  session = { cards: queue, pos: 0, correct: 0, revealed: false, mode, cycleDay: day };
  viewMode = 'session';
  renderNav();
  renderPage();
}

function grammarExampleHtml(card) {
  const g = card.ref;
  return `
    <div class="study-example">
      <div class="ex-jp jp">${g.ex}</div>
      <div class="ex-reading jp">${g.exReading}</div>
      <div class="ex-kr">${g.exKr}</div>
    </div>`;
}

let activeSessionKeyHandler = null;
function renderStudySession(main) {
  if (!session || session.pos >= session.cards.length) { renderSessionDone(main); return; }
  session.revealed = false;
  const card = session.cards[session.pos];
  const pct = (session.pos / session.cards.length) * 100;
  main.innerHTML = `
    <div class="session-bar">
      <div class="session-progress"><div class="session-progress-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="session-meta">${DECK_LABELS[card.deck]} · ${session.pos + 1} / ${session.cards.length}</div>
    </div>
    <div class="study-card" id="studyCard">
      <div class="study-front-row">
        <div class="study-front jp">${card.front}</div>
        ${speakBtnHtml(card.deck === 'grammar' ? card.ref.ex : card.front, 'lg')}
      </div>
      <div class="study-back" id="studyBack" style="display:none;">
        <div class="study-back-text jp">${card.back}</div>
        ${card.hasExample ? grammarExampleHtml(card) : ''}
      </div>
      <div class="tap-hint" id="tapHint">탭하거나 스페이스바로 뜻 보기</div>
    </div>
    <div class="grade-row" id="gradeRow" style="display:none;">
      <button data-g="again" class="grade-btn g-again">다시<span>1</span></button>
      <button data-g="hard" class="grade-btn g-hard">어려움<span>2</span></button>
      <button data-g="good" class="grade-btn g-good">좋음<span>3</span></button>
      <button data-g="easy" class="grade-btn g-easy">쉬움<span>4</span></button>
    </div>
  `;

  const studyCard = main.querySelector('#studyCard');
  const reveal = () => {
    session.revealed = true;
    main.querySelector('#studyBack').style.display = 'flex';
    main.querySelector('#tapHint').style.display = 'none';
    main.querySelector('#gradeRow').style.display = 'grid';
  };
  studyCard.addEventListener('click', () => { if (!session.revealed) reveal(); });

  main.querySelectorAll('.grade-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const grade = btn.dataset.g;
      await gradeCard(card.id, grade);
      session.pos++;
      renderNav();
      renderPage();
    });
  });

  if (activeSessionKeyHandler) document.removeEventListener('keydown', activeSessionKeyHandler);
  activeSessionKeyHandler = function keyHandler(e) {
    if (viewMode !== 'session') { document.removeEventListener('keydown', keyHandler); activeSessionKeyHandler = null; return; }
    if (!session.revealed && e.code === 'Space') { e.preventDefault(); reveal(); return; }
    if (session.revealed && ['1','2','3','4'].includes(e.key)) {
      const map = {1:'again',2:'hard',3:'good',4:'easy'};
      main.querySelector(`.grade-btn[data-g="${map[e.key]}"]`)?.click();
    }
  };
  document.addEventListener('keydown', activeSessionKeyHandler);
}

// ==================== DAILY QUIZ ====================
let quizState = null; // { questions, pos, score }

function matchesFilter(card, filter) {
  if (!filter) return true;
  if (filter.deck && card.deck !== filter.deck) return false;
  if (filter.script && card.script !== filter.script) return false;
  return true;
}
function buildQuizQuestion(card, filter) {
  const sameGroup = ALL_CARDS.filter(c => c.deck === card.deck && c.id !== card.id && matchesFilter(c, filter));
  const distractors = shuffle(sameGroup).slice(0, 3).map(c => c.short);
  const options = shuffle([card.short, ...new Set(distractors)]);
  return { card, options, correct: card.short };
}
function buildQuiz(n, filter) {
  n = n || 10;
  const scoped = ALL_CARDS.filter(c => matchesFilter(c, filter));
  const wrong = scoped.filter(isInWrongQueue);
  const seen = scoped.filter(c => progressMap.has(c.id) && !isInWrongQueue(c));
  let pool = [...shuffle(wrong), ...shuffle(seen)];
  if (pool.length < n) pool = pool.concat(shuffle(scoped.filter(c => !pool.includes(c))));
  return pool.slice(0, n).map(c => buildQuizQuestion(c, filter));
}

function startQuiz(main, filter) {
  const questions = buildQuiz(10, filter);
  if (questions.length === 0) return;
  quizState = { questions, pos: 0, score: 0, answered: false, filter };
  viewMode = 'quiz';
  renderNav();
  renderPage();
}

function renderQuizPage(main) {
  if (!quizState || quizState.pos >= quizState.questions.length) { renderQuizDone(main); return; }
  const q = quizState.questions[quizState.pos];
  const card = q.card;
  const pct = (quizState.pos / quizState.questions.length) * 100;
  main.innerHTML = `
    <div class="session-bar">
      <div class="session-progress"><div class="session-progress-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="session-meta">퀴즈 · ${DECK_LABELS[card.deck]} · ${quizState.pos + 1} / ${quizState.questions.length} · 맞음 ${quizState.score}</div>
    </div>
    <div class="study-card" style="cursor:default;">
      <div class="study-front-row">
        <div class="study-front jp">${card.front}</div>
        ${speakBtnHtml(card.deck === 'grammar' ? card.ref.ex : card.front, 'lg')}
      </div>
    </div>
    <div class="quiz-options" id="quizOptions">
      ${q.options.map(opt => `<button class="quiz-opt" data-opt="${opt.replace(/"/g,'&quot;')}">${opt}</button>`).join('')}
    </div>
    <div id="quizNextWrap" style="display:none; text-align:center; margin-top:16px;">
      <button class="primary-btn" id="quizNextBtn">다음 문제</button>
    </div>
  `;

  main.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (quizState.answered) return;
      quizState.answered = true;
      const chosen = btn.dataset.opt;
      const correct = chosen === q.correct;
      if (correct) quizState.score++;
      main.querySelectorAll('.quiz-opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.opt === q.correct) b.classList.add('correct');
        else if (b === btn) b.classList.add('incorrect');
      });
      await gradeCard(card.id, correct ? 'good' : 'again');
      main.querySelector('#quizNextWrap').style.display = 'block';
    });
  });
  main.querySelector('#quizNextBtn')?.addEventListener('click', () => {
    quizState.pos++;
    quizState.answered = false;
    renderNav();
    renderPage();
  });
}

function renderQuizDone(main) {
  const total = quizState.questions.length;
  const score = quizState.score;
  metaData.lastQuizDate = todayIdx();
  metaData.lastQuizScore = `${score}/${total}`;
  saveMeta();
  main.innerHTML = `
    <div class="session-done">
      <div class="big display">퀴즈 완료!</div>
      <p style="color:var(--ink-soft);">${total}문제 중 <b style="color:var(--indigo);">${score}개</b> 정답 · 틀린 문제는 오답 복습에 자동으로 들어가요.</p>
      <button class="primary-btn" id="backHomeBtn" style="margin-top:14px;">홈으로 돌아가기</button>
    </div>`;
  main.querySelector('#backHomeBtn').addEventListener('click', () => {
    quizState = null;
    viewMode = 'normal';
    currentTab = 'home';
    renderNav();
    renderPage();
  });
}

function renderSessionDone(main) {
  if (activeSessionKeyHandler) { document.removeEventListener('keydown', activeSessionKeyHandler); activeSessionKeyHandler = null; }
  const total = session ? session.cards.length : 0;
  const mode = session ? session.mode : 'srs';
  if (mode === 'cycle' && session.cycleDay != null) {
    markCycleDayDone(session.cycleDay).then(() => { renderNav(); });
  }
  let extraMsg = '';
  if (mode === 'wrong') extraMsg = '오답 카드들을 다시 확인했어요. 연속으로 2번 맞히면 오답 목록에서 빠져요.';
  else if (mode === 'cycle') extraMsg = `${session.cycleDay}일차 회독을 마쳤어요.`;
  main.innerHTML = `
    <div class="session-done">
      <div class="big display">수고하셨습니다!</div>
      <p style="color:var(--ink-soft);">이번 세션에서 ${total}개 카드를 복습했어요. 연속 학습 ${metaData.streak || 0}일째.<br>${extraMsg}</p>
      <button class="primary-btn" id="backHomeBtn" style="margin-top:14px;">홈으로 돌아가기</button>
    </div>`;
  main.querySelector('#backHomeBtn').addEventListener('click', () => {
    session = null;
    pendingCycleDay = null;
    viewMode = 'normal';
    currentTab = 'home';
    renderNav();
    renderPage();
  });
}

// ==================== STATS PAGE ====================
function renderStatsPage(main) {
  if (!storageReady) {
    main.innerHTML = `<div class="page-head"><h1>통계</h1></div><div class="placeholder-card">불러오는 중...</div>`;
    return;
  }
  const decks = ['kana', 'kanji', 'vocab', 'grammar'];
  main.innerHTML = `
    <div class="page-head">
      <h1>통계</h1>
      <p>학습 현황을 한눈에 확인하세요.</p>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">연속 학습</div><div class="value">${metaData.streak || 0}일</div></div>
      <div class="stat-card"><div class="label">누적 복습 횟수</div><div class="value">${metaData.totalReviews || 0}회</div></div>
      <div class="stat-card"><div class="label">전체 카드 수</div><div class="value">${ALL_CARDS.length}개</div></div>
    </div>
    ${decks.map(d => {
      const s = deckStats(d);
      const pct = (n) => s.total ? (n / s.total * 100).toFixed(1) : 0;
      return `
      <div class="stat-card" style="margin-bottom:14px;">
        <div class="label">${DECK_LABELS[d]} · 총 ${s.total}개</div>
        <div class="bar-track">
          <div class="bar-seg mastered" style="width:${pct(s.mastered)}%"></div>
          <div class="bar-seg learning" style="width:${pct(s.learning)}%"></div>
          <div class="bar-seg due" style="width:${pct(s.due)}%"></div>
          <div class="bar-seg new" style="width:${pct(s.new)}%"></div>
        </div>
        <div class="bar-legend">
          <span><i style="background:var(--moss)"></i>완료 ${s.mastered}</span>
          <span><i style="background:var(--indigo)"></i>학습중 ${s.learning}</span>
          <span><i style="background:var(--hanko)"></i>복습대기 ${s.due}</span>
          <span><i style="background:var(--border)"></i>신규 ${s.new}</span>
        </div>
      </div>`;
    }).join('')}
  `;
}

// ==================== PROFILE GATE ====================
function renderProfileGate() {
  document.querySelector('.app').style.display = 'none';
  const gate = document.createElement('div');
  gate.id = 'profileGate';
  gate.className = 'profile-gate';
  gate.innerHTML = `
    <div class="profile-gate-card">
      <div class="seal display" style="width:44px;height:44px;font-size:22px;margin:0 auto 14px;">語</div>
      <h1 class="display">누가 학습할까요?</h1>
      <p>로그인 없이, 이 기기에서 각자의 진도로 따로 저장돼요.</p>
      <div class="profile-btn-row">
        ${PROFILES.map(p => `<button class="profile-btn" data-p="${p.id}">${p.label}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(gate);
  gate.querySelectorAll('.profile-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeProfile = btn.dataset.p;
      localStorage.setItem('n3_active_profile', activeProfile);
      progressMap = new Map();
      metaData = { streak: 0, lastStudyDay: null, totalReviews: 0, newCardLimit: 20, cycleCount: 0, cycleDoneDays: [], lastQuizDate: null, lastQuizScore: null };
      storageReady = false;
      dbApi = null;
      session = null; quizState = null; viewMode = 'normal'; currentTab = 'home';
      gate.remove();
      document.querySelector('.app').style.display = '';
      startApp();
    });
  });
}

async function startApp() {
  renderNav();
  renderPage();
  await initStorage();
  renderNav();
  renderPage();
}

// ==================== BOOT ====================
(function boot() {
  if (!activeProfile) { renderProfileGate(); return; }
  startApp();
})();
</script>
